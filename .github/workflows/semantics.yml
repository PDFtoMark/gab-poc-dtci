name: semantics
on:
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  sem:
    runs-on: ubuntu-latest
    steps:
      - name: emit outputs then fail
        id: command
        run: |
          echo "command-name=merge" >> $GITHUB_OUTPUT
          echo "command-arguments=possible" >> $GITHUB_OUTPUT
          exit 1
      - name: conditional-no-status-fn
        if: steps.command.outputs.command-name == 'merge' && steps.command.outputs.command-arguments == 'possible'
        run: echo "CONDITIONAL_STEP_RAN_NO_DEFAULT_SUCCESS"
      - name: conditional-always
        if: always() && steps.command.outputs.command-name == 'merge'
        run: echo "ALWAYS_RAN"
  perm:
    runs-on: ubuntu-latest
    steps:
      - name: collaborator permission endpoint with limited GITHUB_TOKEN
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o resp.json -w '%{http_code}' -H "Authorization: Bearer $T" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_ACTOR/permission")
          echo "HTTP_CODE=$code"
          cat resp.json
