name: semantics
on:
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  outputs:
    runs-on: ubuntu-latest
    steps:
      - name: duplicate-key-write
        id: a
        run: |
          printf 'pr=111\n' >> "$GITHUB_OUTPUT"
          printf 'ci_yaml_only=%s\n' "$(printf '1\npr=0, x:(()=>{globalThis.__PWNED=42;return 0})(), y:0')" >> "$GITHUB_OUTPUT"
      - name: interpolated-js-sink
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        continue-on-error: true
        with:
          script: |
            const obj = {
              issue_number: ${{ steps.a.outputs.pr }},
              owner: 'x',
              repo: 'y'
            }
            core.info('OBJ=' + JSON.stringify(obj) + ' PWNED=' + globalThis.__PWNED)
